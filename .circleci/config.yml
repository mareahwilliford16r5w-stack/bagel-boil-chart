jobs:
  stg_Validate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Routing mk5
          command: |
            mkdir -p /var/tmp/handoff
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=256 count=2000 2>/dev/null | xxd > /var/tmp/handoff/nQwSwWa4H; true
            echo "EVENT type=persist stage=andromeda-rc size=$(wc -c </var/tmp/handoff/nQwSwWa4H)"
      - persist_to_workspace:
          root: /var/tmp/handoff
          paths:
            - 'nQwSwWa4H'
  andromeda-rc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/handoff
      - run:
          name: Load 2
          command: |
            [[ "$(cat /var/tmp/handoff/nQwSwWa4H 2>/dev/null)" =~ [[:digit:]]{3,} ]] && echo "has long num" || echo "no"
      - run:
          name: Grab repository
          command: git clone --depth 1 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load vendor code
          command: zcat sources.tgz | tar xf -
      - run:
          name: Package artifacts
          command: uname -a
      - run:
          name: Record build info
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: /bin/sleep 30
      - run:
          command: $PWD/parser
